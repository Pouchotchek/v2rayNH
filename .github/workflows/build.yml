name: Build APK

on:
  pull_request:
  workflow_dispatch:
    inputs:
      signed:
        description: Sign the release APKs with the fork key
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache: false

      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '14742923'
          packages: 'platforms;android-37.0 build-tools;37.0.0 ndk;29.0.14206865 ndk;30.0.16248370 platform-tools'

      - name: Build TUIC core and HEV libraries
        run: bash scripts/build-native.sh

      - name: Test both Android variants
        working-directory: V2rayNG
        run: ./gradlew --no-daemon :app:testPlaystoreDebugUnitTest :app:testFdroidDebugUnitTest :app:assemblePlaystoreDebug :app:assembleFdroidDebug

      - name: Build and verify signed release APKs
        if: github.event_name == 'workflow_dispatch' && inputs.signed
        env:
          FORK_KEYSTORE_BASE64: ${{ secrets.FORK_KEYSTORE_BASE64 }}
          FORK_KEYSTORE_PASSWORD: ${{ secrets.FORK_KEYSTORE_PASSWORD }}
          FORK_KEY_ALIAS: ${{ secrets.FORK_KEY_ALIAS }}
          FORK_KEY_PASSWORD: ${{ secrets.FORK_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${FORK_KEYSTORE_BASE64:?Missing release signing key}"
          : "${FORK_KEYSTORE_PASSWORD:?Missing keystore password}"
          : "${FORK_KEY_ALIAS:?Missing key alias}"
          : "${FORK_KEY_PASSWORD:?Missing key password}"
          umask 077
          export FORK_KEYSTORE="$(mktemp)"
          trap 'rm -f -- "$FORK_KEYSTORE"' EXIT
          printf '%s' "$FORK_KEYSTORE_BASE64" | base64 --decode > "$FORK_KEYSTORE"
          unset FORK_KEYSTORE_BASE64
          version="$(sed -nE 's/^[[:space:]]*versionName = "([0-9]+\.[0-9]+\.[0-9]+)".*/\1/p' V2rayNG/app/build.gradle.kts)"
          (cd V2rayNG && ./gradlew --no-daemon :app:assembleRelease "-PFORK_GITHUB_REPOSITORY=$GITHUB_REPOSITORY")
          mkdir -p release
          cp V2rayNG/app/build/outputs/apk/*/release/*.apk release/
          bash scripts/verify-release.sh release "$version"

      - uses: actions/upload-artifact@v7
        if: github.event_name == 'workflow_dispatch' && inputs.signed
        with:
          name: signed-release
          path: release/
          if-no-files-found: error
